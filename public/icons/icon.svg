<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#77216F"/>
      <stop offset="50%" stop-color="#5E2750"/>
      <stop offset="100%" stop-color="#E95420"/>
    </linearGradient>
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C001E"/>
      <stop offset="100%" stop-color="#1E1E2E"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F1F0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E95420"/>
      <stop offset="100%" stop-color="#FF7A45"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with Ubuntu gradient -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Inner Dark Clipboard Board -->
  <rect x="96" y="96" width="320" height="340" rx="36" fill="url(#clipGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Paper Sheet Inside Clipboard -->
  <rect x="128" y="140" width="256" height="260" rx="20" fill="url(#paperGrad)"/>

  <!-- Top Clip Clamp -->
  <rect x="186" y="74" width="140" height="44" rx="16" fill="#383748" stroke="#E95420" stroke-width="4"/>
  <circle cx="256" cy="96" r="10" fill="#E95420"/>

  <!-- Simulated Content Snippet Lines on Paper -->
  <rect x="160" y="180" width="192" height="16" rx="8" fill="#77216F" opacity="0.85"/>
  <rect x="160" y="214" width="140" height="14" rx="7" fill="#E95420" opacity="0.9"/>
  <rect x="160" y="246" width="170" height="12" rx="6" fill="#AEA79F" opacity="0.6"/>
  <rect x="160" y="272" width="120" height="12" rx="6" fill="#AEA79F" opacity="0.6"/>

  <!-- History Clock / Badge Accent -->
  <circle cx="360" cy="370" r="44" fill="url(#accentGrad)" filter="url(#shadow)"/>
  <!-- Clock hands inside badge -->
  <circle cx="360" cy="370" r="38" fill="#1E1E2E"/>
  <line x1="360" y1="370" x2="360" y2="346" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="360" y1="370" x2="376" y2="370" stroke="#E95420" stroke-width="4" stroke-linecap="round"/>
</svg>
